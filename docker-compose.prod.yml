services:
  app:
    image: ghcr.io/${GITHUB_REPOSITORY_OWNER}/actidesk:latest
    restart: always
    environment:
      DATABASE_URL: "postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}?schema=public"
      NODE_ENV: production
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - actidesk-net

  postgres:
    image: postgres:16-alpine
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - actidesk-net

  # Reverse proxy léger avec certificat HTTPS Let's Encrypt automatique
  caddy:
    image: caddy:2-alpine
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - app
    networks:
      - actidesk-net

volumes:
  pgdata:
  caddy_data:
  caddy_config:

networks:
  actidesk-net:
    driver: bridge